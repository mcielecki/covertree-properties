# Dev mode: `docker compose up -d db`. The api and web services are added in the Docker milestone.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-covertree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-covertree}
      POSTGRES_DB: ${POSTGRES_DB:-covertree}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      # $$ defers expansion to the container shell, where the vars are set.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
